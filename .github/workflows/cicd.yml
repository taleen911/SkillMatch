name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t skills-utilization:${{ github.sha }} .

      - name: Scan Image
        run: |
          echo "Scanning image..."
          docker images

  build-and-deploy:
    needs: build-and-scan
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Stop Old Container
        run: |
          docker rm -f skillmatch-app || true

      - name: Deploy Container
        run: |
          docker run -d \
            --name skillmatch-app \
            -p 5000:5000 \
            skills-utilization:${{ github.sha }}

      - name: Verify Deployment
        run: |
          docker ps
